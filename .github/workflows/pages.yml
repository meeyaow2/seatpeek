name: Check Seatpeek
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check JavaScript
        run: npm run check
      - name: Verify Pages entry points
        run: |
          test -f index.html
          test -f .nojekyll
          test -f dist/index.html
